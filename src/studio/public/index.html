<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinefoundry Studio</title>
<style>
  :root { --bg:#0e0f13; --panel:#171920; --line:#272a35; --text:#e9e7e1; --dim:#8d90a0; --gold:#d9b26a; --ok:#6fcf97; --run:#6aa9ff; --bad:#ef6f6f; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif }
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:22px 16px 14px; max-width:1180px; margin:0 auto }
  h1 { margin:0; font:600 26px/1 Georgia,"Songti SC",serif; letter-spacing:.5px }
  h1 span { color:var(--gold) }
  .sub { color:var(--dim) }
  .mem { margin-left:auto; min-width:230px; font-size:13px; color:var(--dim) }
  .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:5px }
  .bar i { display:block; height:100%; background:var(--gold) }
  main { max-width:1180px; margin:0 auto; padding:0 16px 60px }
  .project { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:16px }
  .project h2 { margin:0 0 2px; font-size:18px }
  .brief { color:var(--dim); margin:0 0 14px; white-space:pre-wrap }
  .stages { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px }
  .stage { padding:4px 11px; border-radius:999px; border:1px solid var(--line); font-size:13px; color:var(--dim) }
  .stage.done { color:var(--ok); border-color:#2e5b45 } .stage.running { color:var(--run); border-color:#2d4a78 } .stage.failed { color:var(--bad); border-color:#6b3030 }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px }
  figure { margin:0; background:#101116; border:1px solid var(--line); border-radius:9px; overflow:hidden }
  figure img, figure video { display:block; width:100%; aspect-ratio:9/12; object-fit:cover; background:#000 }
  .grid.wide { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)) } .grid.wide figure img, .grid.wide figure video { aspect-ratio:16/9 }
  .grid.square figure img, .grid.square figure video { aspect-ratio:1/1 }
  figcaption { padding:8px 10px; font-size:12.5px; color:var(--dim) }
  figcaption b { color:var(--text); font-weight:500 }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; border:1px solid #2e5b45; color:var(--ok) }
  .tag.cloud { border-color:#6b5a30; color:var(--gold) }
  .final { margin-top:16px } .final video { width:min(100%,420px); border-radius:9px; border:1px solid var(--line) }
  .empty { color:var(--dim); padding:60px 0; text-align:center }
  code { background:#101116; padding:1px 6px; border-radius:4px }
  .compose { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px }
  .compose textarea { width:100%; min-height:74px; resize:vertical; background:#101116; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:11px 12px; font:inherit }
  .compose textarea:focus { outline:none; border-color:var(--gold) }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px }
  select, button { font:inherit; border-radius:8px; border:1px solid var(--line); background:#101116; color:var(--text); padding:7px 11px }
  button.go { margin-left:auto; background:var(--gold); color:#16130a; border-color:var(--gold); font-weight:600; padding:8px 20px; cursor:pointer }
  button.go:disabled { opacity:.45; cursor:not-allowed }
  .joblog { margin:12px 0 0; padding:11px 13px; background:#0b0c10; border:1px solid var(--line); border-radius:9px; font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9bccb; white-space:pre-wrap; max-height:240px; overflow:auto }
  .joblog b { color:var(--gold); font-weight:500 } .err { color:var(--bad) }
</style>
</head>
<body>
<header>
  <h1>Spot<span>foundry</span></h1><div class="sub">影工坊 · Cinefoundry Harness 工作台</div>
  <div class="mem"><span id="memText">统一内存 …</span><div class="bar"><i id="memBar" style="width:0"></i></div></div>
</header>
<main>
  <section class="compose">
    <textarea id="brief" placeholder="用一两句话说出你的创意，例如：给一款叫“冷”的无糖气泡水做一条 15 秒竖版广告，面向大学生，夏天，清爽"></textarea>
    <div class="row">
      <select id="ratio" aria-label="画幅"><option value="">画幅：自动</option><option>9:16</option><option>16:9</option><option>1:1</option></select>
      <select id="duration" aria-label="时长"><option value="">时长：自动</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="20">20 秒</option></select>
      <select id="videoModel" aria-label="视频模型"><option value="ltx25-fast">LTX-2.5 Fast · 默认</option><option value="ltx25-fast-nvfp4">LTX-2.5 Fast NVFP4</option><option value="wan22-14b">Wan2.2 14B</option><option value="wan22-5b">Wan2.2 5B</option><option value="seedance">Seedance · 云端（需 ARK_API_KEY）</option></select>
      <button class="go" id="go">开拍</button>
    </div>
    <div id="job"></div>
  </section>
  <div id="app"><div class="empty">加载中…</div></div>
</main>
<script>
const STAGE_NAMES = { brief:'需求', creative:'创意', script:'脚本', compliance:'合规', storyboard:'分镜', frames:'生图', qa:'质检', clips:'生视频', cut:'成片', versions:'版本', qc:'技术质检' }
const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
// Recording mode (?record=1): only the most recent project, images load at once, and a clip is shown by its
// first frame (headless browsers used for screen capture cannot play H.264).
const RECORD = new URLSearchParams(location.search).has('record')
if (RECORD && location.hash) document.getElementById('app').innerHTML = ''
const fileUrl = (id, path) => '/files/' + encodeURIComponent(id) + '/' + path.split('/').map(encodeURIComponent).join('/')

function assetCard(project, asset) {
  const url = fileUrl(project.id, asset.path)
  const still = RECORD && asset.kind === 'video' ? project.assets.find((a) => a.kind === 'image' && a.shot === asset.shot && a.stage === 'frames') : undefined
  const media = asset.kind === 'video' && !RECORD ? `<video src="${url}" controls preload="metadata"></video>`
    : asset.kind === 'video' ? (still ? `<img src="${fileUrl(project.id, still.path)}" alt="">` : '<img alt="">')
    : `<img src="${url}" ${RECORD ? '' : 'loading="lazy"'} alt="">`
  const where = asset.execution === 'cloud' ? '<span class="tag cloud">云端</span>' : asset.execution === 'user-supplied' ? '<span class="tag">用户提供</span>' : '<span class="tag">Spark 本地</span>'
  const time = asset.seconds ? ` · ${asset.seconds.toFixed(1)}s` : ''
  return `<figure>${media}<figcaption><b>${asset.shot ? '镜头 ' + asset.shot : esc(asset.id)}</b> ${where}<br>${esc(asset.model ?? '')}${time}</figcaption></figure>`
}

function render(projects) {
  if (RECORD) projects = location.hash ? [] : projects.slice(0, 1)
  if (projects.length === 0) return RECORD ? '' : '<div class="empty">还没有项目。让 Agent 执行 <code>cinefoundry project init</code> 开始。</div>'
  return projects.map((project) => {
    const stages = Object.entries(project.stages).map(([key, stage]) => `<span class="stage ${stage.status}" title="${esc(stage.note)}">${STAGE_NAMES[key] ?? key}</span>`).join('')
    const final = project.assets.find((asset) => asset.id === 'final-cut')
    const shots = project.assets.filter((asset) => asset.id !== 'final-cut' && asset.kind !== 'document').sort((a, b) => (a.shot ?? 0) - (b.shot ?? 0) || a.kind.localeCompare(b.kind))
    return `<section class="project"><h2>${esc(project.title)}</h2><p class="brief">${esc(project.brief)} · ${esc(project.ratio)} · ${project.durationSeconds}s</p>
      <div class="stages">${stages}</div><div class="grid ${project.ratio === '16:9' ? 'wide' : project.ratio === '1:1' ? 'square' : ''}">${shots.map((asset) => assetCard(project, asset)).join('')}</div>
      ${final && !RECORD ? `<div class="final"><h3>成片</h3><video src="${fileUrl(project.id, final.path)}" controls></video><p><a href="${fileUrl(project.id, 'reports/delivery.md')}" target="_blank">交付报告</a> · <a href="${fileUrl(project.id, 'script/script.json')}" target="_blank">脚本</a> · <a href="${fileUrl(project.id, 'storyboard/storyboard.json')}" target="_blank">分镜</a> · <a href="${fileUrl(project.id, 'reports/run.jsonl')}" target="_blank">运行记录</a></p></div>` : ''}</section>`
  }).join('')
}

async function refreshJob() {
  const job = await fetch('/api/job').then((r) => r.json()).catch(() => null)
  const running = job?.status === 'running'
  document.getElementById('go').disabled = running
  document.getElementById('go').textContent = running ? '制作中…' : '开拍'
  if (!job || (RECORD && location.hash)) return
  const lines = job.log.map((line) => esc(line).replace(/▸ (\S+)/, '▸ <b>$1</b>')).join('\n')
  const tail = job.status === 'failed' ? `\n<span class="err">失败：${esc(job.error)}</span>` : job.status === 'done' ? '\n完成 ✓' : ''
  const box = document.getElementById('job')
  const html = `<pre class="joblog">${lines}${tail}</pre>`
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; box.firstChild.scrollTop = 1e6 }
}
document.getElementById('go').addEventListener('click', async () => {
  const durationSeconds = Number(document.getElementById('duration').value) || undefined
  const response = await fetch('/api/harness', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
    brief: document.getElementById('brief').value, ratio: document.getElementById('ratio').value, durationSeconds, videoModel: document.getElementById('videoModel').value }) })
  if (!response.ok) alert((await response.json()).error)
  else document.getElementById('brief').value = ''
  refreshJob()
})
// A brief can be handed over in the URL fragment: /#给一款叫“冷”的… fills the box without submitting.
try { const preset = decodeURIComponent(location.hash.slice(1)); if (preset) document.getElementById('brief').value = preset } catch {}
setInterval(refreshJob, 2000); refreshJob()

let last = ''
async function refresh() {
  try {
    const [projects, memory] = await Promise.all([fetch('/api/projects').then((r) => r.json()), fetch('/api/memory').then((r) => r.json())])
    const html = render(projects)
    // Re-rendering replaces <video> elements and would stop playback, so only touch the DOM on change.
    if (html !== last) { document.getElementById('app').innerHTML = html; last = html }
    const used = memory.totalGb - memory.availableGb
    document.getElementById('memText').textContent = `统一内存 ${used.toFixed(1)} / ${memory.totalGb} GB`
    document.getElementById('memBar').style.width = (used / memory.totalGb * 100).toFixed(1) + '%'
  } catch (error) { console.error(error) }
}
refresh(); setInterval(refresh, 3000)
</script>
</body>
</html>

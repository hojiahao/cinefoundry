<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinefoundry 影工坊 · Studio</title>
<style>
  :root {
    --bg:#0e0f13; --panel:#15171d; --panel-2:#1a1d25; --sunken:#0b0c10; --line:#272a35; --line-2:#323644;
    --text:#ece9e2; --soft:#c2c0bb; --dim:#8b8e9c; --faint:#5d6070;
    --gold:#d9a441; --gold-1:#f6e2b0; --ember:#e0724f; --grad:linear-gradient(90deg,#f6e2b0 0%,#d9a441 55%,#e0724f 100%);
    --ok:#6fcf97; --run:#e6c15a; --bad:#ef6f6f;
    --r:12px; --r-sm:8px;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --serif:"Iowan Old Style",Georgia,"Songti SC","Noto Serif CJK SC",serif;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;
  }
  * { box-sizing:border-box }
  html { color-scheme:dark }
  body { margin:0; background:var(--bg); color:var(--text); font:14.5px/1.6 var(--sans); -webkit-font-smoothing:antialiased }
  a { color:var(--gold-1); text-decoration:none } a:hover { color:#fff }
  button, input, select, textarea { font:inherit; color:inherit }
  .wrap { max-width:1240px; margin:0 auto; padding:0 28px }
  .num { font-variant-numeric:tabular-nums }

  /* top bar */
  .top { position:sticky; top:0; z-index:20; background:rgba(14,15,19,.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line) }
  .top .wrap { display:flex; align-items:center; gap:18px; height:62px }
  .brand { display:flex; align-items:baseline; gap:10px; color:var(--text) }
  .brand b { font:600 22px/1.25 var(--serif); padding-bottom:2px; letter-spacing:.3px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent }
  .brand span { color:var(--dim); font-size:13px; letter-spacing:2px }
  .top .right { margin-left:auto; display:flex; align-items:center; gap:18px }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px; border:1px solid var(--line); font-size:12.5px; color:var(--soft); white-space:nowrap }
  .pill i { width:7px; height:7px; border-radius:50%; background:var(--faint) }
  .pill.live i { background:var(--run); box-shadow:0 0 0 3px rgba(230,193,90,.18); animation:pulse 1.6s infinite }
  .pill.idle i { background:var(--ok) }
  @keyframes pulse { 50% { opacity:.45 } }
  .mem { width:200px; font-size:12px; color:var(--dim) }
  .mem .bar { height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin-top:5px }
  .mem .bar i { display:block; height:100%; background:var(--grad); transition:width .6s }

  main.wrap { padding-top:30px; padding-bottom:90px }
  h2.section { display:flex; align-items:baseline; gap:12px; margin:40px 0 16px; font-size:17px; font-weight:600; letter-spacing:.3px }
  h2.section small { color:var(--dim); font-weight:400; font-size:13px }
  h2.section .aside { margin-left:auto; font-weight:400 }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r) }

  /* compose */
  .compose { padding:24px 24px 20px }
  .compose h1 { margin:0 0 4px; font:600 21px/1.3 var(--sans) }
  .compose .lede { margin:0 0 18px; color:var(--dim) }
  .formats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px }
  .fmt { position:relative; text-align:left; cursor:pointer; padding:14px 16px 13px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); transition:border-color .15s, background .15s }
  .fmt:hover { border-color:var(--line-2) }
  .fmt[aria-checked="true"] { border-color:transparent; background:linear-gradient(var(--panel-2),var(--panel-2)) padding-box, var(--grad) border-box }
  .fmt .name { display:flex; align-items:baseline; gap:8px; font-size:15.5px; font-weight:600 }
  .fmt .name small { color:var(--dim); font-weight:400; font-size:12px; letter-spacing:.4px }
  .fmt .spec { margin-top:4px; color:var(--dim); font-size:12.5px; line-height:1.5 }
  .fmt[aria-checked="true"] .name { color:var(--gold-1) }
  textarea, input[type=text], input[type=number], select { width:100%; background:var(--sunken); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 11px; outline:none; transition:border-color .15s }
  textarea:focus, input:focus, select:focus { border-color:var(--gold) }
  textarea#brief { min-height:84px; resize:vertical; font-size:15px; line-height:1.65; padding:12px 14px }
  .fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; margin-top:14px }
  .field label { display:block; margin-bottom:5px; font-size:12px; color:var(--dim); letter-spacing:.3px }
  .field.wide { grid-column:1 / -1 }
  .field .hint { margin-top:5px; font-size:12px; color:var(--faint) }
  select { appearance:none; padding-right:28px; background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size:5px 5px; background-repeat:no-repeat }
  .drop { display:flex; align-items:center; gap:12px; min-height:42px; padding:6px 8px 6px 6px; border:1px dashed var(--line-2); border-radius:var(--r-sm); background:var(--sunken); cursor:pointer; color:var(--dim); font-size:13px }
  .drop:hover { border-color:var(--gold) }
  .drop img { width:30px; height:30px; object-fit:cover; border-radius:5px }
  .drop .x { margin-left:auto; padding:0 6px; color:var(--dim); background:none; border:0; cursor:pointer }
  .actions { display:flex; align-items:center; gap:14px; margin-top:18px }
  .actions .note { color:var(--faint); font-size:12.5px }
  .go { margin-left:auto; border:0; border-radius:999px; padding:10px 30px; background:var(--grad); color:#1a1408; font-weight:650; letter-spacing:2px; cursor:pointer; box-shadow:0 6px 22px rgba(217,164,65,.18) }
  .go:disabled { filter:grayscale(.7) brightness(.7); cursor:not-allowed; box-shadow:none }
  .error { margin-top:12px; color:var(--bad); font-size:13px }
  .job { margin-top:18px; border-top:1px solid var(--line); padding-top:16px }
  .job .head { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--soft) }
  .job .head .brief { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 }
  .joblog { margin:10px 0 0; padding:12px 14px; background:var(--sunken); border:1px solid var(--line); border-radius:var(--r-sm); font:12.5px/1.7 var(--mono); color:#aeb1c0; white-space:pre-wrap; max-height:220px; overflow:auto }
  .joblog b { color:var(--gold-1); font-weight:500 } .joblog .err { color:var(--bad) } .joblog .okline { color:var(--ok) }

  /* board */
  .filters { display:flex; gap:6px }
  .chip { padding:4px 12px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--dim); cursor:pointer; font-size:12.5px }
  .chip[aria-pressed="true"] { color:var(--text); border-color:var(--line-2); background:var(--panel-2) }
  .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px }
  .proj { display:flex; flex-direction:column; overflow:hidden; color:var(--text); transition:border-color .15s, transform .15s }
  .proj:hover { border-color:var(--line-2); transform:translateY(-1px); color:var(--text) }
  .thumb { position:relative; aspect-ratio:16/10; background:#0a0b0e radial-gradient(120% 90% at 50% 0%, #1b1d25 0%, #0a0b0e 70%); overflow:hidden }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block }
  .thumb .empty-mark { position:absolute; inset:0; display:grid; place-items:center; color:var(--faint); font:600 15px var(--serif); letter-spacing:3px }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:500; letter-spacing:.5px; background:rgba(14,15,19,.72); border:1px solid rgba(246,226,176,.28); color:var(--gold-1); backdrop-filter:blur(6px) }
  .thumb .badge { position:absolute; top:10px; left:10px }
  .thumb .state { position:absolute; top:10px; right:10px }
  .proj .body { padding:13px 15px 15px; display:flex; flex-direction:column; gap:8px; flex:1 }
  .proj h3 { margin:0; font-size:15.5px; font-weight:600; line-height:1.35 }
  .proj .brief { margin:0; color:var(--dim); font-size:12.8px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .proj .meta { margin-top:auto; display:flex; justify-content:space-between; gap:12px; color:var(--faint); font-size:12px }
  .proj .meta > * { white-space:nowrap } .proj .meta .num { overflow:hidden; text-overflow:ellipsis }
  .segs { display:flex; gap:3px }
  .segs i { flex:1; height:4px; border-radius:2px; background:var(--line) }
  .segs i.done { background:var(--gold) } .segs i.running { background:var(--run); animation:pulse 1.6s infinite } .segs i.failed { background:var(--bad) }
  .status { font-size:12px; color:var(--soft) } .status.failed { color:var(--bad) } .status.running { color:var(--run) } .status.done { color:var(--ok) }
  .blank { padding:70px 0; text-align:center; color:var(--dim) }
  .blank code { font-family:var(--mono); background:var(--sunken); padding:2px 7px; border-radius:5px; color:var(--soft) }

  /* project page */
  .back { color:var(--dim); font-size:13px } .back:hover { color:var(--text) }
  .phead { margin:16px 0 0; display:flex; gap:24px; align-items:flex-start }
  .phead h1 { margin:8px 0 6px; font:600 28px/1.25 var(--sans); letter-spacing:.3px }
  .phead .brief { margin:0; max-width:820px; color:var(--soft); white-space:pre-wrap }
  .facts { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; color:var(--dim); font-size:13px }
  .facts b { color:var(--text); font-weight:500 }
  .track { display:flex; margin-top:26px; padding:18px 20px 16px; overflow-x:auto }
  .step { flex:1; min-width:78px; position:relative; text-align:center; font-size:12.5px; color:var(--faint) }
  .step::before { content:""; position:absolute; top:6px; left:calc(-50% + 9px); right:calc(50% + 9px); height:2px; background:var(--line) }
  .step:first-child::before { display:none }
  .step .dot { position:relative; z-index:1; display:block; width:14px; height:14px; margin:0 auto 7px; border-radius:50%; border:2px solid var(--line-2); background:var(--panel) }
  .step.done { color:var(--soft) } .step.done .dot { border-color:var(--gold); background:var(--gold) } .step.done::before { background:var(--gold) }
  .step.running { color:var(--run) } .step.running .dot { border-color:var(--run); box-shadow:0 0 0 4px rgba(230,193,90,.16); animation:pulse 1.6s infinite }
  .step.failed { color:var(--bad) } .step.failed .dot { border-color:var(--bad); background:var(--bad) }
  .step .sn { display:block; margin-top:2px; font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px }
  .notice { margin-top:12px; padding:10px 14px; border-radius:var(--r-sm); background:rgba(239,111,111,.08); border:1px solid rgba(239,111,111,.3); color:#f3b3b3; font-size:13px }

  .films { display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,1fr); gap:16px; align-items:start }
  .films.vertical { grid-template-columns:repeat(3,minmax(0,300px)) }
  .films.vertical .side { display:contents }
  .films .side { display:grid; gap:16px }
  .player { overflow:hidden }
  .player video, .player .poster { display:block; width:100%; background:#000; aspect-ratio:var(--ar,16/9); object-fit:contain }
  .player .poster { object-fit:cover }
  .player .cap { display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:13px }
  .player .cap { flex-wrap:wrap; row-gap:3px } .player .cap b, .verdict { white-space:nowrap }
  .films.vertical .cap .spec, .ebody .cap .spec, .films:not(.vertical) .side .cap .spec { order:3; flex-basis:100% }
  .player .cap b { font-weight:600 } .player .cap .spec { color:var(--dim) } .player .cap .verdict { margin-left:auto }
  .verdict { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:1px 9px; border-radius:999px; border:1px solid }
  .verdict.pass { color:var(--ok); border-color:rgba(111,207,151,.35) } .verdict.pass-with-warnings { color:var(--run); border-color:rgba(230,193,90,.35) } .verdict.fail { color:var(--bad); border-color:rgba(239,111,111,.4) }
  .pending-film { display:grid; place-items:center; aspect-ratio:var(--ar,16/9); color:var(--faint); font-size:13px; background:var(--sunken) }

  .two { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px }
  .kv { padding:18px 20px }
  .kv h3 { margin:0 0 12px; font-size:13px; color:var(--dim); font-weight:500; letter-spacing:1px }
  .kv dl { margin:0; display:grid; grid-template-columns:72px 1fr; gap:8px 14px; font-size:13.5px }
  .kv dt { color:var(--dim) } .kv dd { margin:0 }
  .quote { font:500 19px/1.6 var(--serif); color:var(--text) }
  .hero { display:flex; gap:16px; padding:16px } .hero img { width:150px; height:150px; object-fit:cover; border-radius:var(--r-sm); background:#000; cursor:zoom-in }
  .hero .t { font-size:13px; color:var(--dim) } .hero .t b { display:block; color:var(--text); font-size:14px; margin-bottom:4px }

  .shots { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--shot,220px),1fr)); gap:12px }
  .shot { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:10px }
  .shot .pic { position:relative; aspect-ratio:var(--ar,16/9); background:var(--sunken); cursor:zoom-in }
  .shot .pic img { width:100%; height:100%; object-fit:cover; display:block }
  .shot .pic .no { position:absolute; left:8px; top:8px; padding:1px 7px; border-radius:5px; font-size:11.5px; background:rgba(0,0,0,.6); color:#fff }
  .shot .pic .clip { position:absolute; right:8px; bottom:8px; padding:1px 7px; border-radius:5px; font-size:11px; background:rgba(0,0,0,.6); color:var(--gold-1) }
  .shot .pic .none { position:absolute; inset:0; display:grid; place-items:center; color:var(--faint); font-size:12px }
  .shot .txt { padding:9px 11px 11px; font-size:12.5px; color:var(--dim); line-height:1.5 }
  .shot .txt b { color:var(--soft); font-weight:500 }
  .shot .txt .say { margin-top:5px; color:var(--text) }
  .shot .txt .gate { margin-top:4px; font-size:11.5px; color:var(--faint) }

  .cast { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,240px)); gap:16px }
  .person { display:flex; flex-direction:column; overflow:hidden }
  .person .face { aspect-ratio:1; background:var(--sunken) radial-gradient(80% 80% at 50% 30%, #1e2029, #0b0c10); position:relative; cursor:zoom-in }
  .person .face img { width:100%; height:100%; object-fit:cover; display:block }
  .person .face .none { position:absolute; inset:0; display:grid; place-items:center; color:var(--faint); font:600 44px var(--serif) }
  .person .body { padding:13px 15px 15px; font-size:13px; color:var(--dim) }
  .person h3 { margin:0 0 2px; font-size:15.5px; color:var(--text); font-weight:600 }
  .person .role { font-size:12.5px; margin-bottom:8px }
  .person .arc { color:var(--soft); margin:0 0 10px }
  .voice { display:flex; align-items:center; gap:8px; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px }
  .voice code { font-family:var(--mono); font-size:12px; color:var(--gold-1); background:var(--sunken); padding:1px 7px; border-radius:5px }

  .episode { margin-top:16px; padding:20px }
  .episode .eh { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap }
  .episode .eh h3 { margin:0; font-size:17px; font-weight:600 } .episode .eh .no { color:var(--gold-1); font:600 13px var(--sans); letter-spacing:1px }
  .episode .eh .aside { margin-left:auto; color:var(--dim); font-size:12.5px }
  .episode .syn { margin:8px 0 0; color:var(--soft) }
  .beats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; font-size:13px; color:var(--dim) }
  .beats div { padding:10px 12px; background:var(--sunken); border-radius:var(--r-sm); border-left:2px solid var(--gold) }
  .beats div + div { border-left-color:var(--ember) }
  .beats b { display:block; font-size:11.5px; color:var(--faint); font-weight:500; letter-spacing:1px; margin-bottom:2px }
  .ebody { display:grid; grid-template-columns:260px 1fr; gap:20px; margin-top:16px; align-items:start }
  .ebody.noplayer { grid-template-columns:1fr }
  .planned { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px }
  .planned div { padding:12px 14px; font-size:13px; color:var(--dim) } .planned b { color:var(--text); font-weight:500 }

  .pack { display:grid; grid-template-columns:200px 1fr; gap:20px; padding:20px }
  .pack .cover { position:relative; aspect-ratio:9/16; border-radius:var(--r-sm); overflow:hidden; background:var(--sunken) }
  .pack .cover img { width:100%; height:100%; object-fit:cover; display:block }
  .pack .cover span { position:absolute; left:10px; right:10px; bottom:14px; text-align:center; font:700 19px/1.3 var(--sans); color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.8) }
  .titles { margin:0 0 14px; padding:0; list-style:none; display:grid; gap:8px }
  .titles li { display:flex; gap:10px; align-items:baseline; font-size:15px }
  .titles li i { font-style:normal; font-size:11px; color:var(--gold-1); border:1px solid rgba(246,226,176,.3); border-radius:4px; padding:0 6px }
  .pack .desc { color:var(--soft); white-space:pre-wrap; font-size:13.5px; margin:0 0 12px }
  .tags { display:flex; flex-wrap:wrap; gap:6px } .tags span { font-size:12.5px; color:var(--gold-1); background:rgba(217,164,65,.08); border-radius:999px; padding:2px 10px }

  table.qc { width:100%; border-collapse:collapse; font-size:13px }
  table.qc th, table.qc td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:top }
  table.qc th { color:var(--dim); font-weight:500; font-size:12px; letter-spacing:.5px }
  table.qc tr:last-child td { border-bottom:0 }
  .checks { display:flex; flex-wrap:wrap; gap:5px }
  .checks span { font-size:11.5px; padding:1px 8px; border-radius:5px; background:var(--sunken); color:var(--dim); cursor:help }
  .checks span.warn { color:var(--run) } .checks span.fail { color:var(--bad); background:rgba(239,111,111,.08) }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:28px }
  .links a { font-size:12.5px; padding:5px 12px; border:1px solid var(--line); border-radius:999px; color:var(--soft) } .links a:hover { border-color:var(--line-2); color:var(--text) }

  .lightbox { position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(5,6,8,.9); padding:40px }
  .lightbox.open { display:grid }
  .lightbox figure { margin:0; max-width:min(1200px,100%); max-height:100%; display:flex; flex-direction:column; align-items:center; gap:12px }
  .lightbox img, .lightbox video { max-width:100%; max-height:calc(100vh - 140px); border-radius:var(--r-sm); background:#000 }
  .lightbox figcaption { color:var(--soft); font-size:13px; text-align:center }

  @media (max-width:860px) {
    .wrap { padding:0 16px } .formats { grid-template-columns:1fr } .films { grid-template-columns:1fr } .ebody { grid-template-columns:1fr } .pack { grid-template-columns:1fr } .mem { display:none } .beats { grid-template-columns:1fr }
  }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><b>Cinefoundry</b><span>影工坊 · STUDIO</span></a>
  <div class="right">
    <span class="pill" id="gpu"><i></i><span>GPU</span></span>
    <div class="mem"><span id="memText" class="num">统一内存</span><div class="bar"><i id="memBar" style="width:0"></i></div></div>
  </div>
</div></header>
<main class="wrap" id="app"><div class="blank">加载中…</div></main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"></div>
<script>
// ------------------------------------------------------------------ helpers
const $ = (selector, root = document) => root.querySelector(selector)
const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
const fileUrl = (id, path) => '/files/' + encodeURIComponent(id) + '/' + String(path).split('/').map(encodeURIComponent).join('/')
const api = (path, init) => fetch(path, init).then(async (r) => { const body = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), { status: r.status }); return body })
// Recording mode (?record=1): images load at once and a film is shown by its poster (headless capture browsers cannot play H.264).
const RECORD = new URLSearchParams(location.search).has('record')
const arCss = (ratio) => ({ '9:16':'9/16', '1:1':'1/1' }[ratio] || '16/9')
const STATUS = { done:'已完成', running:'进行中', failed:'失败', pending:'待开始' }
const VERDICT = { pass:'质检通过', 'pass-with-warnings':'通过 · 有提示', fail:'质检未过' }
const CHECKS = { container:'封装', faststart:'快速起播', video:'视频流', codec:'编码', resolution:'分辨率', frame_rate:'帧率', frame_count:'帧数', duration:'时长', bitrate:'码率', colour:'色彩', audio:'音频流', loudness:'响度', true_peak:'真峰值', loudness_range:'响度范围', clipping:'削波', silence:'静音', black_frames:'黑场', frozen_picture:'画面冻结', ai_label:'AI 标识', subtitles:'字幕', aigc_metadata:'AIGC 元数据' }
const ROLES = { lead:'主角', 'love interest':'感情线', antagonist:'反派', mentor:'导师', supporting:'配角', host:'主持', presenter:'出镜', narrator:'旁白' }
const FRAMING = { wide:'全景', medium:'中景', 'close-up':'特写', 'over-the-shoulder':'过肩', insert:'插入镜头', macro:'微距' }
const ago = (iso) => {
  const s = (Date.now() - new Date(iso).getTime()) / 1000
  if (!isFinite(s)) return ''
  if (s < 60) return '刚刚'; if (s < 3600) return Math.floor(s / 60) + ' 分钟前'; if (s < 86400) return Math.floor(s / 3600) + ' 小时前'
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前'
  return new Date(iso).toLocaleDateString('zh-CN')
}
const secs = (n) => (n == null || !isFinite(n) ? '' : (Math.round(n * 10) / 10) + ' 秒')

let FORMATS = []
const formatInfo = (id) => FORMATS.find((f) => f.id === id)

// ------------------------------------------------------------------ format copy
const FORMAT_COPY = {
  ad: { en:'Ad film', spec:'30 秒主片 + 15 秒、6 秒版本 · 16:9 · 60 fps', label:'创意简报',
    placeholder:'一两句话说清产品、受众和要传达的一件事。例如：给一款叫“冷”的无糖气泡水做一支广告，面向大学生，夏天，清爽。' },
  short: { en:'Short video', spec:'60 秒竖屏 · 30 fps · 附标题、封面与话题', label:'选题',
    placeholder:'讲什么、给谁看。例如：一位咖啡师用一分钟讲清手冲和美式的区别，轻松、有梗。' },
  drama: { en:'Micro-drama', spec:'每集 2 分钟 · 24 fps · 设定、选角、分集成片', label:'故事前提',
    placeholder:'讲出你的故事前提。例如：为了保住外婆留下的老香水店，年轻调香师和要收购整条街的地产继承人签下三个月的假恋爱协议。' },
}
const opt = (value, label, selected) => `<option value="${esc(value)}"${selected ? ' selected' : ''}>${esc(label)}</option>`
const select = (id, label, options, hint) => `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-key="${id}">${options.join('')}</select>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`
function optionFields(format) {
  if (format === 'ad') return [
    select('ratio', '画幅', [opt('', '按简报 · 默认 16:9', true), opt('16:9', '16:9 横屏'), opt('9:16', '9:16 竖屏'), opt('1:1', '1:1 方形')]),
    select('durationSeconds', '主片时长', [opt('', '按简报 · 默认 30 秒', true), ...[30, 25, 20, 15, 10, 5].map((n) => opt(n, n + ' 秒'))]),
    select('resolution', '交付分辨率', [opt('1080p', '1080p 原生', true), opt('2k', '2K（放大交付）'), opt('4k', '4K（放大交付）'), opt('6k', '6K（放大交付）')]),
    select('fps', '帧率', [opt('60', '60 fps', true), opt('24', '24 fps'), opt('30', '30 fps'), opt('120', '120 fps')]),
    select('videoModel', '视频模型', [opt('ltx25-fast-nvfp4', 'LTX-2.5 Fast NVFP4', true), opt('ltx25-fast', 'LTX-2.5 Fast INT8'), opt('wan22-14b', 'Wan2.2 14B'), opt('wan22-5b', 'Wan2.2 5B'), opt('seedance', 'Seedance · 云端')]),
    `<div class="field"><label>产品照片 <span style="color:var(--faint)">选填</span></label><div class="drop" id="drop" tabindex="0"><span>上传实拍图作定妆图</span></div><input type="file" id="photo" accept="image/png,image/jpeg,image/webp" hidden></div>`,
    `<div class="field wide"><label for="proof">可证实的事实 <span style="color:var(--faint)">选填</span></label><input type="text" id="proof" data-key="proof" maxlength="1000" placeholder="客户能提供依据的参数、数据与出处，例如：每罐 0 糖 0 卡（配料表）。文案只会使用这些说法。"></div>`,
  ]
  if (format === 'short') return [
    select('episodeSeconds', '时长', [15, 30, 60, 90, 120, 180].map((n) => opt(n, n < 60 ? n + ' 秒' : n === 60 ? '60 秒 · 默认' : (n / 60) + ' 分钟', n === 60))),
    select('ratio', '画幅', [opt('9:16', '9:16 竖屏 · 默认', true), opt('16:9', '16:9 横屏'), opt('1:1', '1:1 方形')]),
    select('fps', '帧率', [opt('30', '30 fps · 默认', true), opt('24', '24 fps'), opt('60', '60 fps')]),
  ]
  return [
    `<div class="field"><label for="episodes">总集数</label><input type="number" id="episodes" data-key="episodes" min="1" max="30" value="10"><div class="hint">剧集设定按此规划分集</div></div>`,
    `<div class="field"><label for="produce">本次制作</label><input type="number" id="produce" data-key="produce" min="1" max="10" value="2"><div class="hint">从第 1 集起，制作前几集</div></div>`,
    select('episodeSeconds', '单集时长', [60, 90, 120, 150, 180].map((n) => opt(n, n % 60 ? n + ' 秒' : (n / 60) + ' 分钟' + (n === 120 ? ' · 默认' : ''), n === 120))),
  ]
}

// ------------------------------------------------------------------ home
const form = { format: ['ad', 'short', 'drama'].includes(new URLSearchParams(location.search).get('format')) ? new URLSearchParams(location.search).get('format') : 'ad', upload: null, error: '' }
let projects = []
let filter = 'all'
let job = null

function renderHome() {
  const copy = FORMAT_COPY[form.format]
  return `<section class="card compose">
    <h1>新建项目</h1><p class="lede">选定片种，写下想法。从剧本、选角、生图到成片和质检，全部在这台 DGX Spark 上完成。</p>
    <div class="formats" role="radiogroup" aria-label="片种">${['ad', 'short', 'drama'].map((id) => `<button class="fmt" role="radio" data-format="${id}" aria-checked="${form.format === id}">
      <div class="name">${esc(formatInfo(id)?.name ?? id)}<small>${FORMAT_COPY[id].en}</small></div><div class="spec">${FORMAT_COPY[id].spec}</div></button>`).join('')}</div>
    <div class="field"><label for="brief">${copy.label}</label><textarea id="brief" placeholder="${esc(copy.placeholder)}">${esc(form.brief ?? '')}</textarea></div>
    <div class="fields" id="fields">${optionFields(form.format).join('')}</div>
    <div class="actions"><span class="note">一次只制作一支片子 · 素材默认只在本机生成</span><button class="go" id="go">开拍</button></div>
    <div class="error" id="formError" ${form.error ? '' : 'hidden'}>${esc(form.error)}</div>
    <div id="job"></div>
  </section>
  <h2 class="section">项目 <small id="count"></small><span class="aside filters" id="filters"></span></h2>
  <div id="board"></div>`
}

function projectCard(p) {
  const done = p.stages.filter((s) => s.status === 'done').length
  const current = p.stages.find((s) => s.status === 'running') ?? p.stages.find((s) => s.status === 'failed')
  const lastDone = [...p.stages].reverse().find((s) => s.status === 'done')
  const state = p.status === 'running' ? `${esc(current?.label)} · 进行中` : p.status === 'failed' ? `失败于「${esc(current?.label)}」` : p.status === 'done' ? '已完成' : lastDone ? `停在「${esc(lastDone.label)}」` : '待开始'
  const length = p.format === 'drama' ? `每集 ${p.durationSeconds} 秒` : `${p.durationSeconds} 秒`
  return `<a class="card proj" href="#/p/${encodeURIComponent(p.id)}">
    <div class="thumb">${p.cover ? `<img src="${fileUrl(p.id, p.cover)}" alt="" ${RECORD ? '' : 'loading="lazy"'}>` : `<div class="empty-mark">${esc(p.formatName)}</div>`}<span class="badge">${esc(p.formatName)}</span></div>
    <div class="body"><h3>${esc(p.title)}</h3><p class="brief">${esc(p.brief)}</p>
      <div class="segs" title="${done} / ${p.stages.length} 道工序">${p.stages.map((s) => `<i class="${s.status}"></i>`).join('')}</div>
      <div class="meta"><span class="status ${p.status}">${state}</span><span class="num">${esc(p.ratio)} · ${length} · ${ago(p.updatedAt)}</span></div></div></a>`
}

function renderBoard() {
  const board = $('#board'); if (!board) return
  const counts = { all: projects.length }
  for (const p of projects) counts[p.format] = (counts[p.format] ?? 0) + 1
  $('#filters').innerHTML = [['all', '全部'], ['ad', formatInfo('ad')?.name], ['short', formatInfo('short')?.name], ['drama', formatInfo('drama')?.name]]
    .map(([id, name]) => `<button class="chip" data-filter="${id}" aria-pressed="${filter === id}">${esc(name)}${counts[id] ? ' ' + counts[id] : ''}</button>`).join('')
  const shown = projects.filter((p) => filter === 'all' || p.format === filter)
  $('#count').textContent = projects.length ? `${projects.length} 个` : ''
  const html = shown.length ? `<div class="board">${shown.map(projectCard).join('')}</div>`
    : `<div class="blank">${projects.length ? '这个片种还没有项目。' : '还没有项目。在上面写下第一个想法，或运行 <code>cinefoundry ad "&lt;简报&gt;"</code>。'}</div>`
  if (board.dataset.html !== html) { board.innerHTML = html; board.dataset.html = html }
}

function renderJob() {
  const box = $('#job'); if (!box) return
  const running = job?.status === 'running'
  const go = $('#go'); if (go) { go.disabled = running; go.textContent = running ? '制作中…' : '开拍' }
  if (!job) { box.innerHTML = ''; return }
  const lines = job.log.map((line) => esc(line).replace(/▸ (\S+)/, '▸ <b>$1</b>')).join('\n')
  const tail = job.status === 'failed' ? `\n<span class="err">失败：${esc(job.error)}</span>` : job.status === 'done' ? '\n<span class="okline">完成</span>' : ''
  const name = formatInfo(job.format)?.name ?? ''
  const state = job.status === 'running' ? '<span class="status running">制作中</span>' : job.status === 'done' ? `<span class="status done">已完成</span>${job.projectId ? ` · <a href="#/p/${encodeURIComponent(job.projectId)}">查看项目</a>` : ''}` : '<span class="status failed">已停止</span>'
  const html = `<div class="job"><div class="head"><span class="badge">${esc(name)}</span><span class="brief">${esc(job.brief)}</span>${state}</div><pre class="joblog">${lines || '准备中…'}${tail}</pre></div>`
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; const log = $('.joblog', box); if (log) log.scrollTop = 1e6 }
}

function bindHome() {
  const app = $('#app')
  app.querySelectorAll('.fmt').forEach((button) => button.addEventListener('click', () => {
    form.brief = $('#brief').value; form.format = button.dataset.format; form.error = ''; form.upload = null
    route(true)
  }))
  $('#filters').addEventListener('click', (event) => { const chip = event.target.closest('.chip'); if (chip) { filter = chip.dataset.filter; renderBoard() } })
  const episodes = $('#episodes'), produce = $('#produce')
  if (episodes && produce) episodes.addEventListener('input', () => { produce.max = episodes.value || 1; if (+produce.value > +episodes.value) produce.value = episodes.value })
  const drop = $('#drop'), photo = $('#photo')
  if (drop) {
    drop.addEventListener('click', (event) => { if (!event.target.closest('.x')) photo.click() })
    drop.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); photo.click() } })
    drop.addEventListener('dragover', (event) => { event.preventDefault(); drop.style.borderColor = 'var(--gold)' })
    drop.addEventListener('dragleave', () => { drop.style.borderColor = '' })
    drop.addEventListener('drop', (event) => { event.preventDefault(); drop.style.borderColor = ''; if (event.dataTransfer.files[0]) upload(event.dataTransfer.files[0]) })
    photo.addEventListener('change', () => { if (photo.files[0]) upload(photo.files[0]) })
    showUpload()
  }
  $('#go').addEventListener('click', submit)
  renderBoard(); renderJob()
}

function showUpload() {
  const drop = $('#drop'); if (!drop) return
  drop.innerHTML = form.upload ? `<img src="${form.upload.preview}" alt=""><span>${esc(form.upload.name)}</span><button class="x" title="移除" aria-label="移除">✕</button>` : `<span>${form.upload === false ? '上传中…' : '上传实拍图作定妆图'}</span>`
  const x = $('.x', drop); if (x) x.addEventListener('click', () => { form.upload = null; showUpload() })
}

async function upload(file) {
  setError('')
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return setError('请上传 PNG、JPEG 或 WebP 图片。')
  form.upload = false; showUpload()
  try {
    const result = await api('/api/upload', { method: 'POST', headers: { 'content-type': file.type }, body: file })
    form.upload = { id: result.id, name: file.name, preview: URL.createObjectURL(file) }
  } catch (error) { form.upload = null; setError(error.message) }
  showUpload()
}

function setError(message) { form.error = message; const box = $('#formError'); if (box) { box.textContent = message; box.hidden = !message } }

async function submit() {
  setError('')
  const body = { format: form.format, brief: $('#brief').value }
  document.querySelectorAll('#fields [data-key]').forEach((input) => { body[input.dataset.key] = input.value })
  if (form.upload?.id) body.productImage = form.upload.id
  try {
    job = await api('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    form.brief = ''; $('#brief').value = ''; form.upload = null; showUpload()
  } catch (error) { setError(error.message) }
  renderJob()
}

// ------------------------------------------------------------------ project page
const player = (id, path, poster, ratio, caption) => {
  const media = !path ? `<div class="pending-film">尚未成片</div>`
    : RECORD ? (poster ? `<img class="poster" src="${fileUrl(id, poster)}" alt="">` : `<div class="pending-film">成片</div>`)
    : `<video src="${fileUrl(id, path)}" ${poster ? `poster="${fileUrl(id, poster)}"` : ''} controls preload="metadata" playsinline></video>`
  return `<div class="card player" style="--ar:${arCss(ratio)}">${media}<div class="cap">${caption}</div></div>`
}
const verdict = (qc) => (qc ? `<span class="verdict ${qc.verdict}">${VERDICT[qc.verdict] ?? esc(qc.verdict)}</span>` : '')
const specLine = (qc, fallbackSeconds) => [qc?.width && qc?.height ? `${qc.width}×${qc.height}` : '', qc?.fps ? `${qc.fps} fps` : '', secs(qc?.seconds ?? fallbackSeconds), qc?.loudness != null && isFinite(qc.loudness) ? `${qc.loudness.toFixed(1)} LUFS` : ''].filter(Boolean).join(' · ')

// Stage notes are written by the engine; the ones with a fixed shape read in Chinese under the step, the rest stay in the tooltip.
const NOTE_RULES = [
  [/^(\d+) shots?$/, (m) => `${m[1]} 个镜头`], [/^(\d+) beats?\b.*$/, (m) => `${m[1]} 拍`], [/^([\d.]+)\s?s$/, (m) => `${m[1]} 秒`],
  [/^(\d+) regenerations?$/, (m) => (m[1] === '0' ? '一次通过' : `重生成 ${m[1]} 次`)], [/^(\d+) episode\(s\)$/, (m) => `${m[1]} 集`],
  [/^(\d+) characters? · (\d+) episodes?$/, (m) => `${m[1]} 个角色 · ${m[2]} 集`], [/^(\d+) (?:presenters?|characters?)$/, (m) => `${m[1]} 个角色`],
  [/^(\d+) cast$/, (m) => `${m[1]} 位演员`], [/^(\d+) frames?$/, (m) => `${m[1]} 帧画面`], [/^(\d+) lines?$/, (m) => `${m[1]} 句对白`], [/^(\d+) clips?$/, (m) => `${m[1]} 个片段`],
  [/^0 review-level findings$/, () => '无待审项'], [/^(\d+) review-level findings?$/, (m) => `${m[1]} 项待审`], [/^approved$/, () => '通过'],
  [/^pass$/, () => '通过'], [/^pass-with-warnings$/, () => '通过 · 有提示'], [/^fail$/, () => '未过'], [/^(15s|06s)(, (15s|06s))*$/, (m) => m[0].replace('15s', '15 秒').replace('06s', '6 秒')],
]
function noteZh(note) {
  if (!note) return ''
  for (const [pattern, format] of NOTE_RULES) { const m = pattern.exec(note.trim()); if (m) return format(m) }
  return /[\u3400-\u9fff]/.test(note) ? note : ''
}

function stageTrack(p) {
  const failed = p.stages.find((s) => s.status === 'failed')
  return `<div class="card track">${p.stages.map((s) => `<div class="step ${s.status}" title="${esc(s.label)} · ${STATUS[s.status] ?? s.status}${s.note ? '：' + esc(s.note) : ''}"><span class="dot"></span>${esc(s.label)}<span class="sn">${esc(s.status === 'done' ? noteZh(s.note) : s.status === 'pending' ? '' : STATUS[s.status])}</span></div>`).join('')}</div>
    ${failed?.note ? `<div class="notice">「${esc(failed.label)}」失败：${esc(failed.note)}</div>` : ''}`
}

function shotCard(id, ratio, s, extra) {
  return `<div class="shot"><div class="pic" style="--ar:${arCss(ratio)}" data-zoom="${s.clip ? fileUrl(id, s.clip) : s.frame ? fileUrl(id, s.frame) : ''}" data-poster="${s.frame ? fileUrl(id, s.frame) : ''}" data-cap="${esc(extra.caption)}">
    ${s.frame ? `<img src="${fileUrl(id, s.frame)}" alt="" ${RECORD ? '' : 'loading="lazy"'}>` : '<div class="none">画面待生成</div>'}<span class="no num">${esc(extra.no)}</span>${s.clip ? '<span class="clip">▶ 片段</span>' : ''}</div>
    <div class="txt">${extra.body}</div></div>`
}

function qcTable(qc) {
  if (!qc.length) return ''
  return `<h2 class="section">技术质检 <small>每个交付文件用 ffprobe 与 ffmpeg 实测</small></h2><div class="card"><table class="qc"><thead><tr><th style="width:110px">文件</th><th style="width:130px">结论</th><th style="width:260px">实测</th><th>检查项</th></tr></thead><tbody>
    ${qc.map((r) => `<tr><td><b>${esc(QC_LABEL(r.label))}</b></td><td>${verdict(r)}</td><td class="num" style="color:var(--dim)">${esc(specLine(r))}</td><td><div class="checks">${r.results.map((c) => `<span class="${c.status}" title="${esc(c.detail)}">${esc(CHECKS[c.check] ?? c.check)}${c.status === 'pass' ? '' : c.status === 'warn' ? ' · 提示' : ' · 未过'}</span>`).join('')}</div></td></tr>`).join('')}
  </tbody></table></div>`
}
const QC_LABEL = (label) => label === 'master' ? '主片' : label === '15s' ? '15 秒版' : label === '06s' ? '6 秒版' : /^ep(\d+)$/.test(label) ? `第 ${Number(label.slice(2))} 集` : label

function renderAd(p) {
  const d = p.detail
  const poster = d.shots.find((s) => s.frame)?.frame ?? d.hero?.path
  const master = d.deliverables.find((x) => x.id === 'master')
  const cuts = d.deliverables.filter((x) => x.id !== 'master')
  const films = `<h2 class="section">成片 <small>${p.stages.some((s) => s.id === 'versions') || cuts.length ? '主片与版本' : '主片'}</small></h2>
    <div class="films${p.ratio === '16:9' ? '' : ' vertical'}"><div>${player(p.id, master?.path, poster, p.ratio, `<b>主片</b><span class="spec num">${esc(specLine(master?.qc, master?.seconds) || p.durationSeconds + ' 秒')}</span><span class="verdict-wrap" style="margin-left:auto">${verdict(master?.qc)}</span>`)}</div>
    <div class="side">${(p.stages.some((s) => s.id === 'versions') || cuts.length ? ['15s', '06s'] : []).map((vid) => { const c = cuts.find((x) => x.id === vid); return player(p.id, c?.path, poster, p.ratio, `<b>${vid === '15s' ? '15 秒版' : '6 秒版'}</b><span class="spec num">${esc(specLine(c?.qc, c?.seconds))}</span><span style="margin-left:auto">${verdict(c?.qc)}</span>`) }).join('')}</div></div>`
  const b = d.brief, t = d.treatment
  const brief = b || t || d.hero ? `<h2 class="section">需求与创意</h2><div class="two">
    ${b ? `<div class="card kv"><h3>需求</h3><dl>${[['产品', b.product], ['受众', b.audience], ['核心信息', b.message], ['调性', b.tone], ['品牌字', b.brandText]].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
    ${t ? `<div class="card kv"><h3>创意</h3>${t.proposition ? `<div class="quote">${esc(t.proposition)}</div>` : ''}<dl style="margin-top:12px">${[['洞察', t.insight], ['概念', t.concept]].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
    ${d.hero ? `<div class="card hero"><img src="${fileUrl(p.id, d.hero.path)}" alt="" data-zoom="${fileUrl(p.id, d.hero.path)}" data-cap="产品定妆图"><div class="t"><b>产品定妆图</b>${d.hero.execution === 'user-supplied' ? '客户实拍图' : '本机生成'}${d.hero.gate ? ' · ' + esc(d.hero.gate.replace('gate', '质检分')) : ''}<br>整片每一格画面都从这张图出发，产品不会走样。</div></div>` : ''}
  </div>` : ''
  const shots = d.shots.length ? `<h2 class="section">分镜与画面 <small>${d.shots.length} 个镜头</small></h2><div class="shots" style="--shot:${p.ratio === '9:16' ? '170px' : '250px'}">${d.shots.map((s) => shotCard(p.id, p.ratio, s, {
    no: '镜头 ' + s.shot, caption: `镜头 ${s.shot}${s.onScreenText ? ' · ' + s.onScreenText : ''}`,
    body: `<b>${esc([FRAMING[s.framing] ?? s.framing, s.camera].filter(Boolean).join(' · ') || '—')}</b>${s.onScreenText ? `<div class="say">“${esc(s.onScreenText)}”</div>` : ''}${s.voiceover ? `<div style="margin-top:3px">旁白：${esc(s.voiceover)}</div>` : ''}${s.gate ? `<div class="gate">${esc(s.gate.replace('gate', '质检分').replace('(kept after failed gate)', '· 未过关，保留最佳').replace('unverified: the reviewer never concluded', '质检未出结论'))}</div>` : ''}`,
  })).join('')}</div>` : ''
  return films + brief + shots + qcTable(p.qc)
}

function renderNarrative(p) {
  const d = p.detail
  const vertical = p.ratio === '9:16'
  let html = ''
  if (p.format === 'short') {
    const ep = d.episodes[0]
    const pack = d.packaging
    const poster = pack?.coverImage ?? ep?.shots.find((s) => s.frame)?.frame
    html += `<h2 class="section">成片与平台包装</h2><div class="films" style="grid-template-columns:${vertical ? '300px 1fr' : 'minmax(0,1.6fr) minmax(0,1fr)'}">
      ${player(p.id, ep?.cut, poster, p.ratio, `<b>成片</b><span class="spec num">${esc(specLine(ep?.qc, p.durationSeconds))}</span><span style="margin-left:auto">${verdict(ep?.qc)}</span>`)}
      ${pack ? `<div class="card pack" style="grid-template-columns:${pack.coverImage ? '160px 1fr' : '1fr'}">${pack.coverImage ? `<div class="cover"><img src="${fileUrl(p.id, pack.coverImage)}" alt=""><span>${esc(pack.cover?.text)}</span></div>` : ''}
        <div><div style="font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:8px">标题 · 三版 A/B 测试</div><ol class="titles">${(pack.titles ?? []).map((t, i) => `<li><i>${'ABC'[i]}</i>${esc(t)}</li>`).join('')}</ol>
        <p class="desc">${esc(pack.description)}</p><div class="tags">${(pack.hashtags ?? []).map((h) => `<span>${esc(h.startsWith('#') ? h : '#' + h)}</span>`).join('')}</div>
        ${pack.cover ? `<div style="margin-top:12px;font-size:12px;color:var(--faint)">封面取自镜头 ${esc(pack.cover.shot)}，封面字“${esc(pack.cover.text)}”</div>` : ''}</div></div>`
      : `<div class="card kv"><h3>平台包装</h3><div style="color:var(--dim)">成片完成后生成三版标题、封面、简介与话题。</div></div>`}</div>`
  }
  if (d.bible) html += `<h2 class="section">${p.format === 'drama' ? '剧集设定' : '选题'}</h2><div class="card kv"><div class="quote">${esc(d.bible.logline)}</div>
    <dl style="margin-top:14px"><dt>类型</dt><dd>${esc(d.bible.genre)}</dd><dt>世界</dt><dd>${esc(d.bible.world)}</dd><dt>影调</dt><dd>${esc(d.bible.look)}</dd></dl></div>`
  if (d.cast.length) html += `<h2 class="section">角色 <small>定妆照锁定外貌，音色锁定声音，每一集都是同一个人</small></h2><div class="cast">${d.cast.map((c) => `<div class="card person">
    <div class="face" ${c.portrait ? `data-zoom="${fileUrl(p.id, c.portrait)}" data-cap="${esc(c.name)} · 定妆照"` : ''}>${c.portrait ? `<img src="${fileUrl(p.id, c.portrait)}" alt="" ${RECORD ? '' : 'loading="lazy"'}>` : `<div class="none">${esc((c.name.split('/').pop() || c.name).trim().slice(0, 1))}</div>`}</div>
    <div class="body"><h3>${esc(c.name)}</h3><div class="role">${esc(ROLES[c.role] ?? c.role)} · ${esc(c.age)} 岁 · ${c.gender === 'female' ? '女' : '男'}${c.gate != null ? ` · 定妆质检 ${esc(c.gate)}` : ''}</div>
    <p class="arc">${esc(c.arc)}</p>
    <div class="voice" title="${esc(c.voiceDescription)}">音色 ${c.voice ? (c.voice === 'designed' ? '<code>专属设计</code>' : `<code>${esc(c.voice)}</code>`) : '<span style="color:var(--faint)">选角后确定</span>'}</div></div></div>`).join('')}</div>`
  if (p.format === 'drama') {
    const made = d.episodes.filter((e) => e.shots.length || e.cut || e.scenes)
    const planned = d.episodes.filter((e) => !made.includes(e))
    html += `<h2 class="section">分集 <small>规划 ${d.episodes.length} 集 · 已开发 ${made.length} 集</small></h2>`
    html += made.map((e) => episodeBlock(p, e)).join('')
    if (planned.length) html += `<h2 class="section" style="margin-top:28px;font-size:15px">待制作 <small>${planned.length} 集</small></h2><div class="planned">${planned.map((e) => `<div class="card"><b>第 ${e.episode} 集 · ${esc(e.title)}</b><br>${esc(e.synopsis)}</div>`).join('')}</div>`
  } else if (d.episodes[0]?.shots.length) {
    const e = d.episodes[0]
    html += `<h2 class="section">分镜与画面 <small>${e.shots.length} 个镜头${e.lines ? ` · ${e.lines} 句对白` : ''}</small></h2>${shotGrid(p, e)}`
  }
  return html + qcTable(p.qc)
}

function shotGrid(p, e) {
  return `<div class="shots" style="--shot:${p.ratio === '9:16' ? '140px' : '220px'}">${e.shots.map((s) => shotCard(p.id, p.ratio, s, {
    no: String(s.shot), caption: `第 ${e.episode} 集 · 镜头 ${s.shot}${s.line ? ` · ${s.line.speaker}：${s.line.zh}` : ''}`,
    body: `<b>${esc(FRAMING[s.framing] ?? s.framing)}</b> · 场 ${esc(s.scene)}${s.line ? `<div class="say">${esc((s.line.speaker.split('/').pop() || '').trim())}：${esc(s.line.zh)}</div>` : ''}`,
  })).join('')}</div>`
}

function episodeBlock(p, e) {
  const poster = e.shots.find((s) => s.frame)?.frame
  const stats = [e.scenes ? `${e.scenes} 场` : '', e.lines ? `${e.lines} 句对白` : '', e.shots.length ? `${e.shots.length} 个镜头` : ''].filter(Boolean).join(' · ')
  return `<div class="card episode"><div class="eh"><span class="no">第 ${e.episode} 集</span><h3>${esc(e.title)}</h3><span class="aside">${esc(stats)}</span>${verdict(e.qc)}</div>
    ${e.synopsis ? `<p class="syn">${esc(e.synopsis)}</p>` : ''}
    ${e.hook || e.cliffhanger ? `<div class="beats">${e.hook ? `<div><b>开场钩子</b>${esc(e.hook)}</div>` : ''}${e.cliffhanger ? `<div><b>结尾悬念</b>${esc(e.cliffhanger)}</div>` : ''}</div>` : ''}
    <div class="ebody ${e.cut ? '' : 'noplayer'}">${e.cut ? player(p.id, e.cut, poster, p.ratio, `<b>成片</b><span class="spec num">${esc(specLine(e.qc, p.durationSeconds))}</span>`) : ''}
    <div>${e.shots.length ? shotGrid(p, e) : '<div style="color:var(--faint);font-size:13px">分镜待生成</div>'}</div></div></div>`
}

function renderProject(p) {
  const length = p.format === 'drama' ? `每集 ${p.durationSeconds} 秒` : `${p.durationSeconds} 秒`
  const episodes = p.format === 'drama' && p.detail.episodes.length ? `<span>集数 <b class="num">${p.detail.episodes.length}</b></span>` : ''
  const body = p.format === 'ad' ? renderAd(p) : renderNarrative(p)
  return `${RECORD ? '' : '<a class="back" href="#/">← 全部项目</a>'}
    <div class="phead"><div style="flex:1;min-width:0"><span class="badge">${esc(p.formatName)}</span><h1>${esc(p.title)}</h1><p class="brief">${esc(p.brief)}</p>
    <div class="facts num"><span>画幅 <b>${esc(p.ratio)}</b></span><span>时长 <b>${esc(length)}</b></span>${episodes}<span>更新 <b>${ago(p.updatedAt)}</b></span><span>项目 <b>${esc(p.id)}</b></span></div></div></div>
    ${stageTrack(p)}${body}
    ${p.links.length ? `<div class="links">${p.links.map((l) => `<a href="${fileUrl(p.id, l.path)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>` : ''}`
}

// ------------------------------------------------------------------ lightbox
const box = $('#lightbox')
document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-zoom]')
  if (target && target.dataset.zoom) {
    const src = target.dataset.zoom
    const media = /\.mp4$/.test(src) && !RECORD ? `<video src="${src}" ${target.dataset.poster ? `poster="${target.dataset.poster}"` : ''} controls autoplay playsinline></video>` : `<img src="${/\.mp4$/.test(src) ? target.dataset.poster : src}" alt="">`
    box.innerHTML = `<figure>${media}<figcaption>${esc(target.dataset.cap ?? '')}</figcaption></figure>`
    box.classList.add('open')
  }
})
const close = () => { box.classList.remove('open'); box.innerHTML = '' }
box.addEventListener('click', (event) => { if (event.target === box) close() })
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close() })

// ------------------------------------------------------------------ routing and refresh
let view = { name: '', id: '' }
let lastDetail = ''
const playing = () => [...document.querySelectorAll('#app video')].some((v) => !v.paused && !v.ended)

async function route(force) {
  const hash = location.hash.slice(1)
  const match = /^\/p\/([a-z0-9-]+)$/.exec(hash)
  const next = match ? { name: 'project', id: match[1] } : { name: 'home', id: '' }
  // RECORD without a route shows the most recent project, as the demo capture expects.
  if (RECORD && next.name === 'home' && !hash && projects[0]) { next.name = 'project'; next.id = projects[0].id }
  if (!force && next.name === view.name && next.id === view.id) return
  view = next; lastDetail = ''
  if (view.name === 'home') {
    // A brief can be handed over in the URL fragment: /#给一款… fills the box without submitting.
    if (hash && !hash.startsWith('/')) { try { form.brief = decodeURIComponent(hash) } catch {} }
    $('#app').innerHTML = renderHome(); bindHome()
    if (form.error) setError(form.error)
    window.scrollTo(0, 0)
  } else {
    $('#app').innerHTML = '<div class="blank">加载中…</div>'
    window.scrollTo(0, 0)
    await refreshDetail()
  }
}

async function refreshDetail() {
  if (view.name !== 'project') return
  try {
    const detail = await api('/api/projects/' + encodeURIComponent(view.id))
    const json = JSON.stringify(detail)
    if (json === lastDetail || playing()) return
    lastDetail = json
    const html = renderProject(detail)
    const y = window.scrollY
    $('#app').innerHTML = html
    window.scrollTo(0, y)
  } catch (error) {
    $('#app').innerHTML = `<a class="back" href="#/">← 全部项目</a><div class="blank">${error.status === 404 ? '没有这个项目。' : esc(error.message)}</div>`
  }
}

async function refreshList() {
  try { projects = await api('/api/projects') } catch { return }
  if (view.name === 'home') renderBoard()
}
async function refreshJob() {
  try { job = await api('/api/job') } catch { return }
  const pill = $('#gpu')
  const running = job?.status === 'running'
  pill.className = 'pill ' + (running ? 'live' : 'idle')
  pill.lastElementChild.textContent = running ? `制作中 · ${formatInfo(job.format)?.name ?? ''}` : 'GPU 空闲'
  if (view.name === 'home') renderJob()
}
async function refreshMemory() {
  try {
    const memory = await api('/api/memory')
    const used = memory.totalGb - memory.availableGb
    $('#memText').textContent = `统一内存 ${used.toFixed(1)} / ${Math.round(memory.totalGb)} GB`
    $('#memBar').style.width = Math.min(100, used / memory.totalGb * 100).toFixed(1) + '%'
  } catch {}
}

window.addEventListener('hashchange', () => route())
;(async () => {
  FORMATS = await api('/api/formats').catch(() => [])
  await Promise.all([refreshList(), refreshJob()])
  await route(true)
  refreshMemory()
  setInterval(refreshList, 3000); setInterval(refreshJob, 2000); setInterval(refreshDetail, 4000); setInterval(refreshMemory, 5000)
})()
</script>
</body>
</html>

# Local inference stack for Cinefoundry on one DGX Spark (GB10, aarch64, ~121 GB unified memory).
#   docker compose -f deploy/spark/compose.yaml --env-file deploy/spark/spark.env up -d
#
# Memory plan (measure and adjust, see the spark-model-scheduler skill):
#   nemotron ~30 GB | stepvl ~20 GB | comfyui ~45 GB peak, on demand | OS + Cinefoundry ~15 GB
# vLLM's --gpu-memory-utilization is a fraction of the WHOLE pool and is claimed at startup,
# so the two LLM services stay at or below ~0.45 combined to leave room for diffusion.

name: cinefoundry

x-gpu: &gpu
  # DGX OS exposes the GPU through CDI (check: docker info | grep -i cdi). On hosts that
  # register the legacy runtime instead, replace this block with `runtime: nvidia`.
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            device_ids: ["nvidia.com/gpu=all"]
            capabilities: [gpu]
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  restart: unless-stopped

services:
  # NVIDIA open model: the director's brain - planning, tool calls, English media prompts.
  # Flags follow the model card's "1x DGX Spark" recipe (DSpark speculative decoding).
  nemotron:
    <<: *gpu
    image: vllm/vllm-openai:${VLLM_TAG:-v0.27.1}
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${SPARK_MODEL_DIR:-${HOME}/models}:/models
    command:
      - --model=nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      - --served-model-name=nemotron-3.5-lightning
      - --host=0.0.0.0
      - --port=8000
      - --moe-backend=marlin
      - --kv-cache-dtype=fp8
      - --enable-prefix-caching
      - --gpu-memory-utilization=${NEMOTRON_GPU_MEM:-0.25}
      - --max-model-len=${NEMOTRON_MAX_LEN:-65536}
      - --mamba-backend=flashinfer
      - --mamba-cache-mode=align
      - --reasoning-parser=nemotron_v3
      - --tool-call-parser=qwen3_coder
      - --enable-auto-tool-choice
      - --speculative_config.model=nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
      - --speculative_config.num_speculative_tokens=3
    ports:
      - "127.0.0.1:8001:8000"

  # NVIDIA's vision-language flagship, the writers' room (opt-in: --profile super, CINEFOUNDRY_WRITER_URL=http://127.0.0.1:8003/v1).
  # Flags follow the model card's DGX Spark recipe (LiLiCorr speculative drafter). It claims most of the pool, so it
  # writes while the other models sleep and is put to sleep for the rest of the run before the first picture; its
  # weights do not survive a level-2 reload on this build, so the next run restarts the container instead.
  nemotron-super:
    <<: *gpu
    profiles: ["super"]
    image: vllm/vllm-openai:${VLLM_SUPER_TAG:-nightly-3f1bcfd82bb2e93fcd364fc7a5491718453a77e2}
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_SERVER_DEV_MODE: "1"
    volumes:
      - ${SPARK_MODEL_DIR:-${HOME}/models}/nemotron-super-vl:/super:ro
    command:
      - --model=/super/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      - --served-model-name=nemotron-3.5-super-vl
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --max-num-seqs=1
      # A fixed KV cache instead of a share of the pool: one writer at a time needs little (hybrid Mamba model). The
      # utilization is then only vLLM's start-up check of free memory; without it the default 0.92 refuses to start.
      - --gpu-memory-utilization=${SUPER_GPU_MEM:-0.70}
      - --kv-cache-memory=${SUPER_KV_BYTES:-6442450944}
      - --max-model-len=${SUPER_MAX_LEN:-65536}
      - --max-num-batched-tokens=8192
      - --speculative_config.model=/super/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr
      - --speculative_config.num_speculative_tokens=7
      - --speculative_config.method=dflash
      - --mamba-backend=flashinfer
      - --mamba-ssm-cache-dtype=float16
      - --enable-mamba-cache-stochastic-rounding
      - --mamba-cache-philox-rounds=5
      - --enable-mamba-shared-prefix-checkpoint
      - --block-size=64
      - --prefix-match-unit=64
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=nemotron_v3
      - --enable-sleep-mode
    ports:
      - "127.0.0.1:8003:8000"

  # Qwen3.8-Flash-Next 125B-A6B in NVIDIA's FP4-Local checkpoint (QAD NVFP4 experts, MXFP8 attention), validated by
  # NVIDIA on DGX Spark (opt-in: --profile qwen). Its 51B-parameter n-gram embedding table is read from NVMe instead of
  # held in memory (VLLM_PLE_TABLE_MEMORY=disk). The checkpoint's compressed scale format is not in upstream vLLM yet,
  # so it runs in the community container NVIDIA's model card names, pinned by digest. Flags follow that card.
  qwen:
    <<: *gpu
    profiles: ["qwen"]
    image: docker.m.daocloud.io/eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595
    entrypoint: ["vllm", "serve"]
    shm_size: 16g
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_PLE_TABLE_MEMORY: disk
      B12X_DISK_BACKEND: io_uring
      CUTE_DSL_ARCH: sm_121a
      SAFETENSORS_FAST_GPU: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: auto
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
      VLLM_B12X_MOE_FP4_FORCE_A16: "1"
      B12X_W4A16_A4_PREFILL: "1"
    volumes:
      - ${SPARK_MODEL_DIR:-${HOME}/models}/qwen38-flash-next:/qwen:ro
      - ${HOME}/.cache/qwen38/vllm:/root/.cache/vllm
      - ${HOME}/.cache/qwen38/flashinfer:/root/.cache/flashinfer
      - ${HOME}/.cache/qwen38/triton:/root/.triton
      - ${HOME}/.cache/qwen38/b12x:/root/.cache/b12x
    command:
      - /qwen/Qwen3.8-Flash-Next-FP4-Local
      - --served-model-name=qwen3.8-flash-next
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      - --mamba-cache-mode=align
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --dtype=bfloat16
      - --kv-cache-dtype=fp8
      - --quantization=modelopt_mixed
      - --block-size=16
      - --load-format=b12x
      - --max-model-len=${QWEN_MAX_LEN:-65536}
      - --max-num-seqs=1
      - --max-num-batched-tokens=${QWEN_BATCHED_TOKENS:-2048}
      - '--speculative-config={"method":"mtp","num_speculative_tokens":4}'
      - --gdn-decode-kernel=b12x
      - --linear-backend=b12x
      - --moe-backend=b12x
      - --no-enable-flashinfer-autotune
      - --mm-encoder-tp-mode=data
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_xml
      - --enable-auto-tool-choice
      - '--compilation-config={"pass_config":{"fuse_act_quant":true}}'
      - --gpu-memory-utilization=${QWEN_GPU_MEM:-0.70}
      - --kv-cache-memory=${QWEN_KV_BYTES:-6442450944}
    ports:
      - "127.0.0.1:8004:8000"

  # StepFun open model: Chinese copy, reference breakdown and the shot quality gate (vision).
  stepvl:
    <<: *gpu
    image: vllm/vllm-openai:${VLLM_TAG:-v0.27.1}
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      # DeepGEMM's FP8 kernels assert on GB10 ("Unknown SF transformation"); use vLLM's generic FP8 path.
      VLLM_USE_DEEP_GEMM: "0"
    volumes:
      - ${SPARK_MODEL_DIR:-${HOME}/models}:/models
    command:
      - --model=stepfun-ai/Step3-VL-10B-FP8
      - --served-model-name=step3-vl-10b
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --gpu-memory-utilization=${STEPVL_GPU_MEM:-0.20}
      - --max-model-len=${STEPVL_MAX_LEN:-32768}
      - --limit-mm-per-prompt={"image":12}
      - --reasoning-parser=deepseek_r1
      - --tool-call-parser=hermes
      - --enable-auto-tool-choice
    ports:
      - "127.0.0.1:8002:8000"

  comfyui:
    <<: *gpu
    build:
      context: ../../runtime-data/ComfyUI
      dockerfile: ../../deploy/spark/comfyui/Dockerfile
      args:
        BASE_IMAGE: vllm/vllm-openai:${VLLM_TAG:-v0.27.1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: cinefoundry/comfyui:local
    # Cap host RAM so a runaway job gets this container OOM-killed instead of thrashing the whole
    # box (2026-10-10: swap filled, tailscaled hung, hard reboot). GPU allocations are not charged
    # to the cgroup and are invisible to the kernel OOM score, so also make this the first victim.
    mem_limit: ${COMFYUI_MEM_LIMIT:-48g}
    memswap_limit: ${COMFYUI_MEM_LIMIT:-48g}
    oom_score_adj: 1000
    volumes:
      - ${SPARK_MODEL_DIR:-${HOME}/models}/comfyui:/opt/ComfyUI/models
      - ../../runtime-data/comfyui/output:/opt/ComfyUI/output
      - ../../runtime-data/comfyui/input:/opt/ComfyUI/input
    ports:
      - "127.0.0.1:8188:8188"
